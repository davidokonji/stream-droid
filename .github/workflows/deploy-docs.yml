name: Deploy docs

# Manually redeploy the TypeDoc site to GitHub Pages from the Actions tab —
# without cutting a release. Use this to publish docs-only changes (guides under
# docs/, README, or API comments) between stable releases; a stable release still
# deploys the docs on its own (see publish-stable.yml). Dispatch from the branch
# whose docs you want live (usually `main`).
on:
  workflow_dispatch:

# Pages deploy: read the source, write the Pages artifact, and mint the OIDC token
# deploy-pages needs. No `contents: write` — this never commits or tags.
permissions:
  contents: read
  pages: write
  id-token: write

# Don't cancel an in-flight Pages deploy; let it finish so the site isn't left
# half-published. Shares the `pages` group with any release-triggered deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-docs:
    name: Deploy API docs to Pages
    # Never run from forks (they can't publish this repo's Pages site anyway).
    if: ${{ github.repository == 'davidokonji/stream-droid' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate TypeDoc
        run: bun run docs:api

      # enablement:true turns Pages on via the API if it isn't already, so this
      # works even before the first release deploys the site.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/api
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Summary
        run: echo "Deployed docs to ${{ steps.deploy.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
