// Trimmed Android Emulator gRPC schema (android.emulation.control) — only the
// RPCs stream-droid uses. Field numbers match the AOSP emulator_controller.proto
// and are wire-compatible. google.protobuf.Empty is replaced by a local empty
// message (zero bytes on the wire) so no well-known-types include path is needed.

syntax = "proto3";
package android.emulation.control;

service EmulatorController {
  rpc getStatus(Empty) returns (EmulatorStatus) {}
  rpc getScreenshot(ImageFormat) returns (Image) {}
  rpc streamScreenshot(ImageFormat) returns (stream Image) {}
  rpc sendKey(KeyboardEvent) returns (Empty) {}
  rpc sendTouch(TouchEvent) returns (Empty) {}
}

message Empty {}

message Rotation {
  enum SkinRotation { PORTRAIT = 0; LANDSCAPE = 1; REVERSE_PORTRAIT = 2; REVERSE_LANDSCAPE = 3; }
  SkinRotation rotation = 1;
  double xAxis = 2;
  double yAxis = 3;
  double zAxis = 4;
}

message ImageFormat {
  enum ImgFormat { PNG = 0; RGBA8888 = 1; RGB888 = 2; }
  ImgFormat format = 1;
  Rotation rotation = 2;
  uint32 width = 3;
  uint32 height = 4;
  uint32 display = 5;
}

message Image {
  ImageFormat format = 1;
  uint32 width = 2;
  uint32 height = 3;
  bytes image = 4;
  uint32 seq = 5;
  uint64 timestampUs = 6;
}

message KeyboardEvent {
  enum KeyCodeType { Usb = 0; Evdev = 1; XKB = 2; Win = 3; Mac = 4; }
  enum KeyEventType { keydown = 0; keyup = 1; keypress = 2; }
  KeyCodeType codeType = 1;
  KeyEventType eventType = 2;
  int32 keyCode = 3;
  string key = 4;
  string text = 5;
}

message Touch {
  int32 x = 1;              // device display pixels, origin top-left
  int32 y = 2;
  int32 identifier = 3;
  int32 pressure = 4;       // > 0 = touching; 0 lifts the contact
  int32 touch_major = 5;
  int32 touch_minor = 6;
  enum EventExpiration { EVENT_EXPIRATION_UNSPECIFIED = 0; NEVER_EXPIRE = 1; }
  EventExpiration expiration = 7;
}

message TouchEvent {
  repeated Touch touches = 1;
  int32 display = 2;
}

message VmConfiguration {
  enum VmHypervisorType { UNKNOWN = 0; NONE = 1; KVM = 2; HAXM = 3; HVF = 4; WHPX = 5; AEHD = 6; }
  VmHypervisorType hypervisorType = 1;
  int32 numberOfCpuCores = 2;
  int64 ramSizeBytes = 3;
}
message Entry { string key = 1; string value = 2; }
message EntryList { repeated Entry entry = 1; }
message EmulatorStatus {
  string version = 1;
  uint64 uptime = 2;
  bool booted = 3;
  VmConfiguration vmConfig = 4;
  EntryList hardwareConfig = 5;
}
